name: Develop Branch Test Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ndex2-client-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install .

      - name: Run tests
        env:
          NDEX2_TEST_SERVER: ${{ secrets.NDEX2_TEST_SERVER }}
          NDEX2_TEST_USER: ${{ secrets.NDEX2_TEST_USER }}
          NDEX2_TEST_PASS: ${{ secrets.NDEX2_TEST_PASS }}
        run: pytest