name: Develop Branch Test Pipeline

on:
  workflow_dispatch:

  push:
  
  pull_request:

# Strictly limits execution to 1 run at a time for the develop branch
concurrency:
  group: ndex2-client-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Force a 30-second pause to wait for subsequent commits (Debounce)
      - name: Wait 30 seconds for follow-up commits
        run: sleep 30

      # Step 2: Checkout the ndex2-client source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 3: Set up Python环境 (Matching repository requirements)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Repository lists Python 3.5+ compatibility

      # Step 4: Install dependencies & run project checks
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install .

      # Step 5: Execute test suite
      - name: Run tests
        run: |
          pytest

  # Verifies the built artifact, not just the source tree. The test job above
  # runs pytest from the repository root, so it imports ./ndex2 and would pass
  # even if the wheel were missing a package.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf build dist *.egg-info
          python -m build --wheel --outdir dist/

      - name: Verify every source package is in the wheel
        run: python scripts/check_packaging.py 'dist/*.whl'

      # The cd is essential. python -c puts the current directory first on
      # sys.path, so running this from the repository root would import the
      # local source instead of the installed package and always pass.
      - name: Import from a clean install, outside the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -c "
          import ndex2
          from ndex2.client import Ndex2
          client = Ndex2(skip_version_check=True)
          print('imported from', ndex2.__file__)
          "
